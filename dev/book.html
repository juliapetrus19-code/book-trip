for (const b of document.querySelectorAll(".lang-switch button")) {

        narration: "Вы надеваете зелёные очки, и город вспыхивает изумрудами. В тронном зале вас ждёт Великий и Ужасный — каждый раз в новом облике.",
        line: { speaker: "wizard", text: "Сначала уничтожьте Злую Волшебницу Запада." } },
      { title: "Ведро воды", setting: "castle", time: "night", weather: "rain", cast: ["wicked-witch", "dorothy"], props: ["throne", "candles", "barrel"], action: "fight", camera: "close_up", mood: "epic",
        narration: "В замке колдуньи гуляют сквозняки. Она хватает серебряный башмачок, Дороти в гневе выплёскивает ведро — и злодейка тает, шипя, как кусок сахара.",
        line: { speaker: "wicked-witch", text: "Смотри, что ты наделала, я таю!" } },
    ],
    videoPrompts: [
      "Cinematic wide shot: a small wooden farmhouse lifted by a swirling grey twister above the Kansas prairie at dusk, a girl in a gingham dress at the window holding a little black dog, dramatic clouds, 8 seconds.",
      "Cinematic tracking shot along a winding yellow brick road through bright cornfields, a girl with braids walks arm in arm with a straw scarecrow, a tin man and a shaggy lion, warm sunny light, 8 seconds.",
      "Cinematic slow push-in: the glowing emerald towers of a fairy-tale city rising behind green gates, sparkling light, travellers in green spectacles looking up in awe, 8 seconds.",
    ],
  },
};

// --- modes ------------------------------------------------------------------------------------------
const health = { live: false, portraits: params.get("portraits") === "1", video: params.get("video") === "1", premiumCodeRequired: true, model: "demo" };
const strip = (b, parts) => {
  const out = { ...b };
  if (parts.includes("overview")) for (const k of ["summary", "themes", "terms", "similar"]) delete out[k];
  if (parts.includes("characters")) delete out.characters;
  if (parts.includes("film")) delete out.film;
  return out;
};
const ERR = {
  overview: { code: "upstream", message: "Сервис пересказов не ответил вовремя." },
  characters: { code: "rate_limited", message: "Слишком много запросов. Подождите минуту." },
  film: { code: "upstream", message: "Не удалось написать сценарий фильма." },
};

let book = SAMPLE;
if (params.has("demo")) {
  // js/api.js fetches "data/…" relative to the site root (index.html); this page lives in /dev/
  const rawFetch = window.fetch.bind(window);
  window.fetch = (url, init) => rawFetch(typeof url === "string" && url.startsWith("data/") ? `../${url}` : url, init);
  const api = await import("../js/api.js");
  book = await api.loadDemoBook(params.get("demo"), lang);
} else if (params.has("loading") || params.has("progressive")) {
  book = { ...strip(SAMPLE, ["overview", "characters", "film"]), source: "live" };
} else if (params.has("error")) {
  book = { ...strip(SAMPLE, ["overview", "characters", "film"]), source: "live", _errors: { ...ERR } };
}

const root = document.getElementById("view-book");
const toast = (msg) => {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
};

let view = null;
let filmFailed = false;
const arrive = (part, ms) => setTimeout(() => {
  const errors = { ...(book._errors || {}) };
  delete errors[part];
  if (part === "film" && params.has("progressive") && !filmFailed) {
    filmFailed = true;
    book = { ...book, _errors: { ...errors, film: ERR.film } };
  } else {
    const src = part === "overview" ? { summary: SAMPLE.summary, themes: SAMPLE.themes, terms: SAMPLE.terms, similar: SAMPLE.similar }
      : part === "characters" ? { characters: SAMPLE.characters } : { film: SAMPLE.film };
    book = { ...book, ...src, _errors: errors };
  }
  view.update(book);
}, ms);

view = renderBook(root, book, {
  lang,
  health,
  onSearch: (q) => { console.log("[dev] onSearch", q); toast(`onSearch: ${q}`); },
  onBack: () => { console.log("[dev] onBack"); toast("onBack()"); },
  onRetry: (part) => {
    console.log("[dev] onRetry", part);
    const errors = { ...(book._errors || {}) };
    delete errors[part];
    book = { ...book, _errors: errors };
    view.update(book);
    arrive(part, 1600);
  },
});
window.__book = { view, get book() { return book; }, SAMPLE };

if (params.has("progressive")) {
  arrive("overview", 1500);
  arrive("characters", 3000);
  arrive("film", 4500);
}
</script>
</body>
</html>
