<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel characters — dev gallery</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js" } }</script>
<style>
  :root { color-scheme: dark; --bg: #07080f; --panel: #12141f; --line: #23263a; --text: #e9ecf6; --muted: #8d93ad; --cyan: #39d6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 40px; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-bottom: 20px; }
  @media (min-width: 900px) { .top { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
  .viewer { aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: #ddd8d1; }
  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button, select { font: inherit; color: var(--text); background: #1b1e2d; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--cyan); color: #fff; box-shadow: inset 0 -2px 0 var(--cyan); }
  select { width: 100%; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, monospace; color: #b9c0dc; background: #0c0e17; border-radius: 10px; padding: 10px; min-height: 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; }
  figure img { display: block; width: 100%; aspect-ratio: 1; background: #e3dfd9; }
  figcaption { padding: 8px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  figcaption b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Voxel character engine</h1>
  <p>Gallery of <span id="count"></span> portraits rendered with <code>renderPortrait</code> through one shared offscreen renderer. Click a card to load it into the interactive viewer.</p>
</header>
<main>
  <section class="top">
    <div class="viewer" id="viewer"></div>
    <div class="controls">
      <label for="pick">Character</label>
      <select id="pick"></select>
      <div class="row" id="actions" role="group" aria-label="Action"></div>
      <div class="row">
        <button type="button" id="stress">Render 30 in a row</button>
        <button type="button" id="leak">Viewer leak test</button>
        <button type="button" id="transparent">Transparent + wave</button>
      </div>
      <pre id="log" aria-live="polite"></pre>
    </div>
  </section>
  <section class="grid" id="grid"></section>
</main>

const grid = document.getElementById("grid");
const pick = document.getElementById("pick");
const log = document.getElementById("log");
document.getElementById("count").textContent = String(CHARACTERS.length);
const say = (s) => { log.textContent = s; };

CHARACTERS.forEach(([name], i) => pick.add(new Option(name, String(i))));

// URL params for quick checks: ?pick=N&action=walk&nogallery
const params = new URLSearchParams(location.search);
const start = Math.min(CHARACTERS.length - 1, Math.max(0, Number(params.get("pick")) || 0));
pick.value = String(start);
let action = ACTIONS.includes(params.get("action")) ? params.get("action") : "idle";
let viewer = createViewer(document.getElementById("viewer"), CHARACTERS[start][1], { label: CHARACTERS[start][0], action });
window.__viewer = () => viewer;
const actionsEl = document.getElementById("actions");
for (const a of ACTIONS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = a; b.setAttribute("aria-pressed", String(a === action));
  b.addEventListener("click", () => {
    action = a; viewer.setAction(a);
    for (const x of actionsEl.children) x.setAttribute("aria-pressed", String(x === b));
  });
  actionsEl.append(b);
}
pick.addEventListener("change", () => { viewer.setAppearance(CHARACTERS[+pick.value][1]); viewer.setAction(action); });

// gallery
const t0 = performance.now();
const times = [];
for (const [i, [name, app]] of CHARACTERS.entries()) {
  const fig = document.createElement("figure");
  const img = document.createElement("img");
  img.alt = name; img.width = 256; img.height = 256;
  const cap = document.createElement("figcaption");
  const b = document.createElement("b"); b.textContent = name;
  const n = normalizeAppearance(app);
  cap.append(b, " · " + [n.creature, n.age, n.hair.style, n.headwear, n.accessory, n.holding].filter((x) => x && x !== "none").join(", "));
  fig.append(img, cap);
  fig.addEventListener("click", () => { pick.value = String(i); pick.dispatchEvent(new Event("change")); window.scrollTo({ top: 0, behavior: "smooth" }); });
  grid.append(fig);
}
const imgs = [...grid.querySelectorAll("img")];
for (const [i, [, app]] of (params.has("nogallery") ? [] : CHARACTERS.entries())) {
  const s = performance.now();
  imgs[i].src = await renderPortrait(app, { size: 512 });
  times.push(performance.now() - s);
}
window.__galleryDone = true;
window.__galleryTimes = times;
say(`gallery: ${CHARACTERS.length} portraits in ${(performance.now() - t0).toFixed(0)} ms\n` + JSON.stringify(portraitStats()));

// stress: 30 distinct new appearances in a row
async function stress() {
  clearPortraitCache();
  const res = [];
  for (let i = 0; i < 30; i++) {
    const [, base] = CHARACTERS[i % CHARACTERS.length];
    const app = { ...base, eyes: "#" + (0x202020 + i * 3).toString(16).padStart(6, "0") };
    const s = performance.now();
    await renderPortrait(app, { size: 512 });
    res.push(performance.now() - s);
  }
  const warm = res.slice(3);
  const out = { avg: warm.reduce((a, b) => a + b, 0) / warm.length, max: Math.max(...warm), first: res[0], stats: portraitStats() };
  say("stress (30 renders, size 512):\n" + JSON.stringify(out, null, 1));
  return out;
}
document.getElementById("stress").addEventListener("click", stress);
window.__stress = stress;

async function leakTest() {
  const host = document.createElement("div");
  host.style.cssText = "width:320px;height:240px;position:fixed;left:-9999px;top:0";
  document.body.append(host);
  const v = createViewer(host, CHARACTERS[3][1]);
  await new Promise((r) => setTimeout(r, 400));
  const before = { ...v.renderer.info.memory };
  v.dispose();
  const after = { ...v.renderer.info.memory };
  host.remove();
  const out = { before, after, canvasRemoved: !host.querySelector("canvas") };
  say("viewer leak test:\n" + JSON.stringify(out, null, 1));
  return out;
}
document.getElementById("leak").addEventListener("click", leakTest);
window.__leakTest = leakTest;

document.getElementById("transparent").addEventListener("click", async () => {
  const url = await renderPortrait(CHARACTERS[+pick.value][1], { size: 512, background: "transparent", pose: "wave" });
  const w = window.open();
  if (w) { w.document.body.style.background = "#123"; const im = w.document.createElement("img"); im.src = url; w.document.body.append(im); }
});

// animation smoke test for every action on every character (no throw)
window.__animSmoke = () => {
  let n = 0;
